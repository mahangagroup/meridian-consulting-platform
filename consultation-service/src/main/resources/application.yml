server:
  port: ${PORT:8082}

spring:
  application:
    name: consultation-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/consultationdb}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
