server:
  port: ${PORT:8081}

spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/userdb}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
